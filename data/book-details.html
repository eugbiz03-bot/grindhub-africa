<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="author" content="Eugene">
  <meta name="publisher" content="Grindhub Africa">
  <meta name="robots" content="index, follow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <title>Book Details</title>
  <link rel="icon" href="../img/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="../css/book.css" />
</head>
<body>
  <h1>book details</h1>
  <div class="book-details-container">
    <img class="book-cover" alt="Book Cover" />
    <div class="book-info">
      <h1 class="book-title">Loading title...</h1>
      <p class="book-description">Loading description...</p>
      <a href="#" target="_blank" class="btn view-btn">📖 View</a>
      <a href="#" download class="btn download-btn download-link">⬇️ Download</a>
    
    <div id="download-options" style="display:none; margin-top:10px;">
    <p>Select format:</p>
     <button data-format="pdf">PDF</button>
     <button data-format="epub">ePub</button>
     <button data-format="mobi">MOBI</button>
    </div>


    </div>
  </div>
  <script src="../js/book-details.js" defer></script>
</body>
</html>
