  <!-- Tools Page -->
  <section class="tool-section">
    <h2 style="text-align: center; margin-bottom: 2rem;">⚙️ Trading & Hustle Tools</h2>

    <!-- Risk Calculator -->
    <div class="tool-card">
      <h3>Risk Calculator (USD)</h3>
      <input type="number" id="accountBalance" placeholder="Account Balance ($)" />
      <input type="number" id="riskPercent" placeholder="Risk % (e.g. 2)" />
      <button onclick="calculateRisk()">Calculate</button>
      <div class="result" id="riskResult"></div>
    </div>

    <!-- Motivation Generator -->
    <div class="tool-card">
      <h3>🔥 Motivation Generator</h3>
      <button onclick="generateQuote()">Get Motivation</button>
      <div class="result" id="quoteResult"></div>
    </div>

    <!-- Lot Size Formula (Visual) -->
    <div class="tool-card">
      <h3>📏 Lot Size Formula</h3>
      <p>Lot Size = (Account Balance × Risk %) / Stop Loss</p>
      <p>Example: (100 × 2%) / 20 = 0.1 lots</p>
    </div>
  </section>
  
  <hr class="rule">
